# Проверка связи со Stash: запускается вручную (Actions → stash-ping → Run workflow
# или `gh workflow run stash-ping`). Ничего не собирает — только просит Worker
# перечитать релизы этой программы CI-токеном из секрета STASH_CI_TOKEN.
# Полезно после выдачи или перевыпуска токена в админке Stash.
name: stash-ping

on: workflow_dispatch

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_ID: hyperhdr-bridge
    steps:
      - name: Проверить CI-токен
        env:
          STASH_CI_TOKEN: ${{ secrets.STASH_CI_TOKEN }}
        run: |
          code=$(curl -s -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${STASH_CI_TOKEN}" \
            "https://stash.stash-worker.workers.dev/v1/admin/refresh?app=${APP_ID}")
          cat response.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Stash ответил ${code}: выдайте или перевыпустите CI-токен в админке Stash и запишите его в секрет STASH_CI_TOKEN"
            exit 1
          fi
          echo "Связь со Stash в порядке"
