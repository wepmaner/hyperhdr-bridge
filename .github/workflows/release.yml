# Релиз по тегу: git tag v0.2.0 && git push --tags
# Собирает exe с версией, упаковывает для Stash и публикует GitHub Release.
# Сборка на Linux: Go собирает Windows-exe и оттуда, а минуты Linux дешевле.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # вся история и теги — для «Что нового»

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Сборка
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # rpcprobe и gsiprobe — инструменты разработчика, в релиз не идут.
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=${VERSION}" -o dist/bridge.exe ./cmd/bridge
          cp configs/config.example.yaml dist/

      - name: Пакет для Stash
        # stash-pack — это инструмент сборки, а не часть моста: запускаем под Linux.
        env:
          GOOS: ''
          GOARCH: ''
        run: go run github.com/wepmaner/stash-pack/cmd/stash-pack@v0.1.1 -dir dist -manifest stash.json -version "${GITHUB_REF_NAME}" -out stash-out

      - name: Что нового
        # Тег с текстом (git tag -a v1.2.0 -m "…") — берём его. Обычный тег — заголовки
        # коммитов с прошлого релиза. --generate-notes не годится: он собирает описание
        # из pull request'ов, а без них выдаёт только ссылку на историю.
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch --force --tags --quiet   # checkout может сделать аннотированный тег «лёгким»
          if [ "$(git cat-file -t "$tag")" = "tag" ]; then
            # git вырезает из текста тега строки на «#», поэтому раздел пишется как
            # «Добавлено:» — строка с двоеточием на конце становится заголовком.
            git tag -l --format='%(contents)' "$tag" | sed '/-----BEGIN PGP/,$d' \
              | sed -E 's/^([^-#[:space:]].*):[[:space:]]*$/## \1/' > notes.md
          else
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
            git log --no-merges --format='%s' ${prev:+$prev..}"$tag" \
              | grep -vE '^[[:space:].]*$' | sed 's/^/- /' > notes.md
          fi
          [ -s notes.md ] || echo "- Без описания" > notes.md
          cat notes.md

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/bridge.exe \
            stash-out/stash.json stash-out/files.json stash-out/package.zip \
            --title "HyperHDR Bridge ${GITHUB_REF_NAME}" \
            --notes-file notes.md

      - name: Обновить каталог Stash
        # Иначе друзья увидят релиз только через ≤30 минут, по cron Worker'а.
        # continue-on-error: релиз уже опубликован, падение пинга его не отменяет.
        continue-on-error: true
        env:
          STASH_CI_TOKEN: ${{ secrets.STASH_CI_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${STASH_CI_TOKEN}" \
            "https://stash.stash-worker.workers.dev/v1/admin/refresh?app=hyperhdr-bridge"
